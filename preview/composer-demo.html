<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kiku composer — two-row layout</title>
<link rel="stylesheet" href="/kiku-styles.css" />
<style>
  body { font-family: system-ui, sans-serif; background: #f6f7f9; margin: 0; padding: 40px 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; margin: 32px 0 10px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 26px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  .old .hsk-cb-input-box { display: flex; align-items: flex-end; gap: 10px; grid-template-areas: none; }
  .old .hsk-cb-field { margin-inline: 5px; width: auto; flex: 1; }
  .old .hsk-cb-textarea { flex: 1; width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Before — one row</h2>
  <div class="card old">
    <div class="hsk-cb-input-box">
      <button class="hsk-cb-attach-btn">+</button>
      <div class="hsk-cb-field">
        <textarea class="hsk-cb-textarea" rows="3">this would be easily integrated into hundreds of prediction, forex, cfd and other live markets, and the text keeps growing down the box</textarea>
      </div>
      <button class="hsk-cb-mic-btn">M</button>
      <button class="hsk-cb-send">↑</button>
    </div>
  </div>

  <h2>After — two rows, short text</h2>
  <div class="card">
    <div class="hsk-cb-input-box">
      <button class="hsk-cb-attach-btn">+</button>
      <div class="hsk-cb-field">
        <textarea class="hsk-cb-textarea" rows="1">what are the odds on USD/JPY?</textarea>
      </div>
      <button class="hsk-cb-mic-btn">M</button>
      <button class="hsk-cb-send">↑</button>
    </div>
  </div>

  <h2>After — two rows, grown text</h2>
  <div class="card">
    <div class="hsk-cb-input-box">
      <button class="hsk-cb-attach-btn">+</button>
      <div class="hsk-cb-field">
        <textarea class="hsk-cb-textarea" rows="3">this would be easily integrated into hundreds of prediction, forex, cfd and other live markets, and the text keeps growing upward instead</textarea>
      </div>
      <button class="hsk-cb-mic-btn">M</button>
      <button class="hsk-cb-send">↑</button>
    </div>
  </div>
</div>
</body>
</html>
